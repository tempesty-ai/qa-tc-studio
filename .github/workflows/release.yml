name: Release Skill

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package skill
        run: |
          cd skills
          zip -r ../qa-tc-studio.zip qa-tc-studio -x "**/.DS_Store"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" qa-tc-studio.zip --clobber
          else
            gh release create "$TAG_NAME" qa-tc-studio.zip \
              --title "$TAG_NAME" \
              --notes "Portable QA TC Studio skill package."
          fi
