name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_tc.py examples/tc_data.example.json
      - run: python scripts/render_report.py examples/tc_data.example.json -o out
      - uses: actions/upload-artifact@v4
        with:
          name: qa-tc-studio-report
          path: out/
          retention-days: 14
